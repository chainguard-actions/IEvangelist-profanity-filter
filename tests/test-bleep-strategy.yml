name: Test bleep replacement strategy with confused reaction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with bleep strategy and confused reaction
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: bleep
          include-updated-note: 'false'
          include-confused-reaction: 'true'
        continue-on-error: true
      - name: Assert action ran with bleep strategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may succeed or fail due to no active issue/PR in workflow_dispatch context.
          # Cancelled would indicate a setup/configuration problem.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with bleep strategy and confused reaction, outcome=$OUTCOME"
