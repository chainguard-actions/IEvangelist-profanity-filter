name: Test custom-profane-words-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          custom-profane-words-url: 'https://raw.githubusercontent.com/IEvangelist/profanity-filter/main/tests/ProfanityFilter.Services.Tests/TestData/profane-words.txt'
          replacement-strategy: 'asterisk'
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action accepted custom-profane-words-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to missing GitHub event context (no real issue/PR),
          # but it must not fail due to an unrecognized input.
          # Acceptable outcomes are 'success' or 'failure' (not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom-profane-words-url input"
