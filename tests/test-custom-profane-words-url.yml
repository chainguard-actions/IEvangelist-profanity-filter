name: Test custom-profane-words-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          custom-profane-words-url: 'https://raw.githubusercontent.com/IEvangelist/profanity-filter/main/src/ProfanityFilter.Services/DefaultProfaneWordSet.txt'
          replacement-strategy: 'asterisk'
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action ran with custom-profane-words-url input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no active issue/PR event context,
          # but what matters is that it accepted the custom-profane-words-url input
          # and attempted to run (not a configuration/input-parsing error).
          # A 'failure' outcome is acceptable here since we're running via workflow_dispatch.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom-profane-words-url input provided"
