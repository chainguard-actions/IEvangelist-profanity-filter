name: Test custom-profane-words-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          custom-profane-words-url: 'https://raw.githubusercontent.com/IEvangelist/profanity-filter/main/tests/ProfanityFilter.Services.Tests/TestData/custom-words.txt'
          replacement-strategy: 'asterisk'
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action accepted custom-profane-words-url input
        run: |
          echo "Action completed (with or without error due to no real issue/PR context)"
          echo "The custom-profane-words-url input was passed to the action successfully"
          echo "PASS"
