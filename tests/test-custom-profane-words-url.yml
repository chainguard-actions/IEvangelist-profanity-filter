name: Test custom-profane-words-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          custom-profane-words-url: 'https://raw.githubusercontent.com/IEvangelist/profanity-filter/main/tests/ProfanityFilter.Services.Tests/TestData/custom-words.txt'
          replacement-strategy: asterisk
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action ran with custom-profane-words-url input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to fake token/no real issue context,
          # but what matters is that the custom-profane-words-url input was accepted.
          # A failure due to API auth is expected; a failure due to unknown input is not.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom-profane-words-url input"
