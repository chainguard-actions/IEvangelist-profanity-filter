name: Test custom-profane-words-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          custom-profane-words-url: 'https://raw.githubusercontent.com/IEvangelist/profanity-filter/main/src/ProfanityFilter.Services/DefaultProfaneWordDataStore.cs'
          replacement-strategy: 'asterisk'
          include-updated-note: 'false'
          include-confused-reaction: 'false'
        continue-on-error: true
      - name: Assert action ran with custom-profane-words-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with custom-profane-words-url input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
