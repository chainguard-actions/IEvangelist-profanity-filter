name: Test manual profane words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with manual profane words
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: asterisk
          manual-profane-words: 'badword,anotherbadword'
          include-updated-note: 'false'
          include-confused-reaction: 'false'
        continue-on-error: true
      - name: Assert action completed (no crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with manual profane words"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
