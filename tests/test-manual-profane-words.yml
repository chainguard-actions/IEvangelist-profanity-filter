name: Test manual profane words
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run profanity filter with manual profane words
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'true'
          manual-profane-words: 'badword1,badword2,badword3'

      - name: Assert action was invoked with manual profane words
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with manual profane words (outcome: ${{ steps.action.outcome }})"
