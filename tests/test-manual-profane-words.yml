name: Test manual profane words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'true'
          manual-profane-words: 'badword1,badword2,badword3'

      - name: Assert action was invoked with manual profane words
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail (no real GitHub context/issue),
          # but it must have been invoked (outcome is 'success' or 'failure', not 'skipped')
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with manual profane words (outcome=$OUTCOME)"
