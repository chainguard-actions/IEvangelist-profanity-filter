name: Test grawlix replacement strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with grawlix replacement strategy
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: grawlix
          include-updated-note: 'false'
        continue-on-error: true
      - name: Assert action ran without configuration error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no issue/PR to process = no-op) or fail
          # because there is no issue/PR event. Either way it must NOT fail
          # due to an invalid replacement-strategy value or missing required input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with grawlix strategy (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
