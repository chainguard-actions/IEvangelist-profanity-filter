name: Test replacement strategy - grawlix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with grawlix replacement strategy
        id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          replacement-strategy: grawlix
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action ran with grawlix strategy
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (success or graceful failure due to no real PR context).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with grawlix replacement strategy"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
