name: Test basic usage - default settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with default settings
        id: action
        continue-on-error: true
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'false'
      - name: Assert action ran (exit code acceptable)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real issue/PR in this context,
          # but it should not crash with an unexpected error code > 1.
          # We just verify it ran and produced a recognizable outcome.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
