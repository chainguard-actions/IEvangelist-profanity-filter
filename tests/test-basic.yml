name: Test basic usage - default settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run profanity filter with default settings
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'false'

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token is fake and there's no real issue/PR context,
          # but it should at least start and attempt to run (not a configuration error).
          # We accept both success and failure outcomes as long as it's not a setup error.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
