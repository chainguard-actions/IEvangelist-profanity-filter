name: Test basic usage with default settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with default settings
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'false'
        continue-on-error: true
      - name: Assert action ran (completed or skipped gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may succeed (no issue/PR to process) or fail due to no event context.
          # Either way it should not be 'cancelled' — that would indicate a setup problem.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (success or failure both acceptable in workflow_dispatch context)"
