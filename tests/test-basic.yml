name: Test basic usage - default asterisk strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with default settings
        id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'false'
      - name: Assert action ran (exit code acceptable - no real GitHub context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action may fail due to no real GitHub token/event context,
          # but it should not fail due to misconfiguration of inputs.
          # success or failure are both acceptable; 'cancelled' is not.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
