name: Test replacement strategy - asterisk
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with asterisk replacement strategy
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          replacement-strategy: asterisk
          include-updated-note: 'true'
          include-confused-reaction: 'false'
        continue-on-error: true
      - name: Assert action ran with asterisk strategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Under workflow_dispatch there is no issue or PR to process.
          # The action should either succeed (nothing to filter) or fail gracefully.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with asterisk strategy, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
