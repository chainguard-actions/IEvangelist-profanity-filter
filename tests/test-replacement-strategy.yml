name: Test replacement strategy - redact
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run profanity filter with redact strategy
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          replacement-strategy: redact
          include-updated-note: 'false'
          include-confused-reaction: 'false'

      - name: Assert action was invoked with redact strategy
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with redact strategy (outcome: ${{ steps.action.outcome }})"
