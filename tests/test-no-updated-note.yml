name: Test include-updated-note disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with updated note disabled
        id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          replacement-strategy: asterisk
          include-updated-note: 'false'
          include-confused-reaction: 'false'
      - name: Assert action ran with include-updated-note=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with include-updated-note=false, outcome=$OUTCOME"
