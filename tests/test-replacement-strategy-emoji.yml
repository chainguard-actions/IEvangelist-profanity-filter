name: Test replacement strategy - emoji with confused reaction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: issues
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run profanity filter with emoji strategy and confused reaction
        id: action
        continue-on-error: true
        uses: .
        with:
          token: fake-token-for-testing
          replacement-strategy: emoji
          include-updated-note: 'true'
          include-confused-reaction: 'true'
      - name: Assert action ran with emoji strategy
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (success or graceful failure due to no real issue context).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with emoji replacement strategy and confused reaction enabled"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
