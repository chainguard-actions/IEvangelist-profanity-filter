name: Release GitHub Action container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The manual version to release'
        required: true

env:
  IMAGE_NAME: ievangelist/profanity-filter
  # The base image is now inferred by the .NET SDK.
  # https://github.com/dotnet/dotnet-docker/blob/nightly/README.runtime-deps.md#full-tag-listing
  # BASE_IMAGE: mcr.microsoft.com/dotnet/nightly/runtime-deps:9.0.0-noble-chiseled-aot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🏷️ Get the version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: 🏷️ Get the version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          safe=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          echo "RELEASE_VERSION=$safe" >> "$GITHUB_ENV"

      - name: 💜 Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Publish app
        working-directory: ./src/ProfanityFilter.Action
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CONTAINER_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          dotnet publish \
            /t:PublishContainer \
            -p DebugType=none \
            -p ContainerRegistry=ghcr.io \
            -p ContainerImageTags="\"latest;$RELEASE_VERSION\"" \
            -p ContainerRepository="$CONTAINER_IMAGE_NAME" \
            -bl

      - name: 📦 Upload build log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: msbuild.binlog
          path: src/ProfanityFilter.Action/msbuild.binlog
