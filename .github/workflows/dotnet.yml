# This workflow will build and test multiple .NET projects using a matrix strategy
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - ProfanityFilter.Action.Tests
          - ProfanityFilter.Client.Tests
          - ProfanityFilter.Services.Tests
          - ProfanityFilter.Common.Tests

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # main

    - name: 💜 Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # main
      with:
        global-json-file: ./global.json

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🧪 Test — ${{ matrix.project }}
      env:
        MATRIX_PROJECT: ${{ matrix.project }}
      run: |
        # Publish the test project.
        dotnet publish --configuration Release "tests/$MATRIX_PROJECT/"

        # Change to the test project directory.
        cd "artifacts/publish/$MATRIX_PROJECT"
        ls
        cd ./release_linux-x64

        # Call test executable.
        "./$MATRIX_PROJECT"
