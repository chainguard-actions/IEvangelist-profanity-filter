name: Release API container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The manual version to release'
        required: true

env:
  IMAGE_NAME: ievangelist/profanity-filter-api
  MSBUILDDEBUGENGINE: 1 # Enable MSBuild binary logging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🏷️ Get the version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: 🏷️ Get the version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          safe=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          echo "RELEASE_VERSION=$safe" >> "$GITHUB_ENV"

      - name: 💜 Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: ✨ Install Aspire CLI
        run: |
          curl -sSL -o /tmp/aspire-install.sh https://aspire.dev/install.sh
          bash /tmp/aspire-install.sh

      - name: 📋 Output Aspire CLI version
        run: aspire --version

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Cache Aspire deployment state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.aspire/deployments
          key: aspire-deploy-${{ hashFiles('**/apphost.cs') }}-${{ github.ref }}
          restore-keys: |
            aspire-deploy-${{ hashFiles('**/apphost.cs') }}-
            aspire-deploy-

      - name: 🚀 Deploy with Aspire
        working-directory: ./playground
        run: aspire deploy --environment production

      - name: 📦 Upload build log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: msbuild.binlog
          path: src/ProfanityFilter.WebApi/msbuild.binlog
